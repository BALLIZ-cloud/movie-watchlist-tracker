services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-watchlist-app
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: movie_watchlist
      DB_USER: movie_user
      DB_PASS: movie_pass
    ports:
      - "${APP_PORT:-8000}:80"
    restart: unless-stopped
    volumes:
      - uploads_data:/var/www/html/public/uploads

  mysql:
    image: mysql:8.4
    container_name: movie-watchlist-db
    environment:
      MYSQL_DATABASE: movie_watchlist
      MYSQL_USER: movie_user
      MYSQL_PASSWORD: movie_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
